<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Virtual</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo-biblioteca.png" type="image/png">
</head>

<body>
    <header class="cabecalho">
        <h1 class="titulo">Biblioteca Virtual</h1>
        <img class="logo" src="img/logo-biblioteca.png" alt="Logo">
    </header>
    <main>
        <section id="catalogo">
            <article class="card-livro">
                <img src="img/cards-capa/mpbc-capa.jpg" alt="{livros.nome}">
                <div class="quadrado-card-livro">
                    <p class="nome-livro"><strong>Memórias póstumas de Brás Cubas</strong></p>
                    <p>DESCRIÇÃO AQUI!!!</p>
                    <p>CATEGORIA AQUI! (switch)</p>
                    <p>R$29,90</p>
                </div>
            </article>
        </section>
    </main>
    <script src="/js/app.js" defer></script>
</body>

</html>
